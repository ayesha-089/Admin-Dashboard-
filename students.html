<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Students | EduAdmin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"></head>
<body><div id="appSidebar"></div><div class="main-content"><div id="appTopbar"></div><main class="container-fluid px-3 px-lg-4 py-4">
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4"><div><p class="eyebrow mb-1">ACADEMIC MANAGEMENT</p><h1 class="page-title">Students</h1><p class="text-secondary mb-0">Add, update, search and manage student records.</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#studentModal">＋ Add Student</button></div>
<div id="alertArea"></div>
<div class="row g-3 mb-4"><div class="col-sm-4"><div class="mini-stat"><span>Total records</span><strong id="studentPageTotal">0</strong></div></div><div class="col-sm-4"><div class="mini-stat"><span>Active</span><strong id="studentPageActive">0</strong></div></div><div class="col-sm-4"><div class="mini-stat"><span>Inactive</span><strong id="studentPageInactive">0</strong></div></div></div>
<div class="card border-0 shadow-sm"><div class="card-body p-3 p-lg-4"><div class="row g-2 mb-3"><div class="col-lg-4"><input id="studentSearch" class="form-control" placeholder="Search students..."></div><div class="col-sm-4 col-lg-2"><select id="studentDepartment" class="form-select"><option value="">All departments</option></select></div><div class="col-sm-4 col-lg-2"><select id="studentSemester" class="form-select"><option value="">All semesters</option></select></div><div class="col-sm-4 col-lg-2"><select id="studentStatus" class="form-select"><option value="">All statuses</option><option>Active</option><option>Inactive</option></select></div><div class="col-lg-2"><select id="studentSort" class="form-select"><option value="newest">Newest first</option><option value="name">Name A–Z</option><option value="roll">Roll number</option></select></div></div>
<div class="table-responsive"><table class="table align-middle admin-table"><thead><tr><th>Student</th><th>Roll Number</th><th>Department</th><th>Semester</th><th>Status</th><th>Actions</th></tr></thead><tbody id="studentsTable"></tbody></table></div><div id="studentsEmpty" class="empty-state d-none">No student records found.</div>
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3"><small id="studentResults" class="text-secondary"></small><div class="btn-group"><button class="btn btn-outline-secondary btn-sm" id="studentPrev">Previous</button><button class="btn btn-outline-secondary btn-sm" id="studentNext">Next</button></div></div>
</div></div></main></div><div id="studentModalMount"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="assets/app.js"></script></body></html>
