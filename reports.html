<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reports | EduAdmin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"></head>
<body><div id="appSidebar"></div><div class="main-content"><div id="appTopbar"></div><main class="container-fluid px-3 px-lg-4 py-4"><p class="eyebrow mb-1">INSIGHTS</p><h1 class="page-title mb-1">Reports</h1><p class="text-secondary mb-4">Student and academic summary reports.</p><div class="row g-3 mb-4"><div class="col-sm-6 col-xl-3"><div class="kpi-card"><div class="kpi-icon purple">♙</div><div><span>Total Students</span><h2 id="reportTotal">0</h2><small>Saved records</small></div></div></div><div class="col-sm-6 col-xl-3"><div class="kpi-card"><div class="kpi-icon green">✓</div><div><span>Active Students</span><h2 id="reportActive">0</h2><small>Active status</small></div></div></div><div class="col-sm-6 col-xl-3"><div class="kpi-card"><div class="kpi-icon orange">▤</div><div><span>Departments</span><h2 id="reportDepartments">0</h2><small>Represented</small></div></div></div><div class="col-sm-6 col-xl-3"><div class="kpi-card"><div class="kpi-icon blue">▣</div><div><span>Inactive Students</span><h2 id="reportInactive">0</h2><small>Inactive status</small></div></div></div></div><div class="row g-3"><div class="col-lg-6"><div class="card border-0 shadow-sm h-100"><div class="card-body p-4"><h5 class="mb-3">Students by Department</h5><div class="table-responsive"><table class="table admin-table"><thead><tr><th>Department</th><th>Students</th><th>Share</th></tr></thead><tbody id="departmentReport"></tbody></table></div></div></div></div><div class="col-lg-6"><div class="card border-0 shadow-sm h-100"><div class="card-body p-4"><h5 class="mb-3">Students by Semester</h5><div class="table-responsive"><table class="table admin-table"><thead><tr><th>Semester</th><th>Students</th></tr></thead><tbody id="semesterReport"></tbody></table></div></div></div></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="assets/app.js"></script></body></html>
